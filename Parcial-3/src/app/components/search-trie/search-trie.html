<section class="panel">
    <h2>1. Buscador Predictivo (Trie)</h2>
    <input class="search-input" type="text" placeholder="Escribe un prefijo (ej: Bl, St, Le)..." #searchBox
        (input)="musicService.onSearchInput(searchBox.value)" />

    @if (musicService.exactExists() !== null) {
    <span class="status-badge" [class.status-badge--found]="musicService.exactExists()"
        [class.status-badge--missing]="!musicService.exactExists()">
        {{ musicService.exactExists() ? '✓ Coincidencia exacta en Trie' : '✗ No existe título exacto' }}
    </span>
    }

    <ul class="item-list">
    @for (title of musicService.suggestions(); track title) {
        <li (click)="musicService.selectByTitle(title)">
        <span>{{ title }}</span>
        <small>Ver relacionadas →</small>
        </li>
    }
    </ul>

    <div class="form-row">
        <input type="text" placeholder="Nuevo título" #newTitle />
        <input type="text" placeholder="Artista" #newArtist />
        <input type="number" placeholder="Reproducciones iniciales" #newPlays />
        <button class="btn-play" (click)="
            addNewSong(newTitle.value, newArtist.value, newPlays.value);
            newTitle.value = '';
            newArtist.value = '';
            newPlays.value = ''
            "
            >
            + Insertar Canción
        </button>
    </div>
</section>
