<div class="tasks-container">
    <header class="header">
        <h2>Mis Tareas</h2>
        <p>Sesión: <strong>{{ authService.currentUser()?.email }}</strong></p>
        <button (click)="handleLogout()">Cerrar Sesión</button>
    </header>

    <div class="add-task">
        <input type="text" placeholder="Escribe una nueva tarea..." [ngModel]="newTaskTitle()"
            (ngModelChange)="newTaskTitle.set($event)" />
        <button (click)="handleAddTask()">Agregar</button>
    </div>

    <ul class="task-list">
        @for (task of taskService.tasks(); track task.id) {
        <li [class.completed]="task.completed">
            <input type="checkbox" [checked]="task.completed" (change)="handleToggleTask(task.id!, task.completed)" />

            @if (editingTaskId() === task.id) {
            <input type="text" [ngModel]="editingTaskTitle()" (ngModelChange)="editingTaskTitle.set($event)" />
            <button (click)="saveEdit(task.id!)">Guardar</button>
            } @else {
            <span (dblclick)="startEditing(task.id!, task.title)">{{ task.title }}</span>
            <button (click)="startEditing(task.id!, task.title)">Editar</button>
            }

            <button (click)="handleDeleteTask(task.id!)">Eliminar</button>
        </li>
        }
    </ul>
</div>
