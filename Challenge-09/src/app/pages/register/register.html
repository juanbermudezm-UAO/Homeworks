<div class="auth-container">
    <h2>Crear Cuenta</h2>

    <div class="form-group">
        <input type="email" placeholder="Correo electrónico" [ngModel]="email()" (ngModelChange)="email.set($event)" />
    </div>

    <div class="form-group">
        <input type="password" placeholder="Contraseña" [ngModel]="password()" (ngModelChange)="password.set($event)" />
    </div>

    <button type="button" (click)="handleRegister()">Registrarse</button>

    <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</div>
