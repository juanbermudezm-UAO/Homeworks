<div class="auth-container">
    <h2>Iniciar Sesión</h2>

    <div class="form-group">
        <input type="email" placeholder="Correo electrónico" [ngModel]="email()" (ngModelChange)="email.set($event)" />
    </div>

    <div class="form-group">
        <input type="password" placeholder="Contraseña" [ngModel]="password()" (ngModelChange)="password.set($event)" />
    </div>

    <button type="button" (click)="handleLogin()">Ingresar</button>

    <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
</div>
