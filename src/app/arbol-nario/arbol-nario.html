<div class="layout">
    <header class="dashboard-header"
        style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #f8f9fa; border-bottom: 1px solid #e9ecef; grid-column: 1 / -1;">
        <h2>Challenge 08 - Menú N-Ario</h2>
        <div class="user-info" style="display: flex; align-items: center; gap: 15px;">
            <span>Usuario: <strong>{{ auth.usuario() }}</strong></span>
            <button (click)="salir()" class="btn-logout"
                style="padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Cerrar Sesión
            </button>
        </div>
    </header>

    <aside class="sidebar">
        <nav class="sidebar-menu">
            <ng-container *ngTemplateOutlet="recursiveMenu; context: { $implicit: arbolMenu.raiz.hijos }">
            </ng-container>
        </nav>
    </aside>

    <main class="content">
        <router-outlet></router-outlet>
    </main>
</div>

<ng-template #recursiveMenu let-nodos>
    <ul class="menu-list">
        @for (nodo of nodos; track nodo.valor.titulo) {
        <li class="menu-item">
            @if (nodo.hijos.length > 0) {

            <div class="menu-parent" (click)="toggleMenu(nodo)">
                <span>{{ nodo.valor.titulo }}</span>
                <span class="arrow">{{ nodo.desplegado ? '▲' : '▼' }}</span>
            </div>

            @if (nodo.desplegado) {
            <div class="submenu-container">
                <ng-container *ngTemplateOutlet="recursiveMenu; context: { $implicit: nodo.hijos }">
                </ng-container>
            </div>
            }
            } @else {

            <a [routerLink]="nodo.valor.link" routerLinkActive="active" class="menu-link">
                {{ nodo.valor.titulo }}
            </a>
            }
        </li>
        }
    </ul>
</ng-template>
