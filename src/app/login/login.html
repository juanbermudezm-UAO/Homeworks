<div class="login-container">
    <div class="login-card">
        <h2>Iniciar Sesión - Challenge 08</h2>
        <p class="subtitle">Estructura de Datos y Algoritmos</p>

        <form (ngSubmit)="entrar()">
            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="user@mail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="123" required>
            </div>

            @if (errorMensaje()) {
            <div class="alert-error">
                {{ errorMensaje() }}
            </div>
            }

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="hints">
            <small>Credenciales de prueba:</small>
            <small>Email: <b>user@mail.com</b></small>
            <small>Password: <b>123</b></small>
        </div>
    </div>
</div>
