@if (contacts.length > 0) {
  <ul class="contact-list">
    @for (contact of contacts; track contact.id) {
      <app-contact-item
        [contact]="contact"
        (deleteContact)="onDelete($event)"
      ></app-contact-item>
    }
  </ul>
} @else {
  <p class="empty-message">No hay contactos todavía. ¡Agrega el primero!</p>
}
