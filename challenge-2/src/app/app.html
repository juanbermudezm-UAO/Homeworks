<main class="app-container">
  <h1>Mis Contactos</h1>

  @if (loading()) {
    <app-loader></app-loader>
  } @else {
    <app-contact-form (addContact)="addContact($event)"></app-contact-form>
    <app-contact-list
      [contacts]="contacts()"
      (deleteContact)="deleteContact($event)"
    ></app-contact-list>
  }
</main>
