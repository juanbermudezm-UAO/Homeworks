<div class="container">
    <header class="header">
        <h1>Challenge 04 - Gestor de Pila de Libros (Stacks / LIFO)</h1>
    </header>

    <div class="content-grid">
        <!-- Formulario para agregar un nuevo libro -->
        <section class="card">
            <h2>Agregar Nuevo Libro</h2>
            <form (ngSubmit)="agregarLibro()" class="form">
                <div class="form-group">
                    <label for="nombre">Nombre del Libro:</label>
                    <input type="text" id="nombre" [(ngModel)]="nuevoLibro.nombre" name="nombre"
                        placeholder="Ej: Rayuela" required />
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN:</label>
                    <input type="text" id="isbn" [(ngModel)]="nuevoLibro.isbn" name="isbn"
                        placeholder="Ej: 978-8437604947" required />
                </div>

                <div class="form-group">
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" [(ngModel)]="nuevoLibro.autor" name="autor"
                        placeholder="Ej: Julio Cortázar" required />
                </div>

                <div class="form-group">
                    <label for="editorial">Editorial:</label>
                    <input type="text" id="editorial" [(ngModel)]="nuevoLibro.editorial" name="editorial"
                        placeholder="Ej: Editorial Sudamericana" required />
                </div>

                <div class="button-actions">
                    <button type="submit" class="btn btn-primary">
                        Agregar como primero
                    </button>
                    <button type="button" class="btn btn-danger" (click)="desapilarLibro()"
                        [disabled]="stack.isEmpty()">
                        Eliminar primero
                    </button>
                </div>
            </form>
        </section>

        <!-- Visualización de la Pila en Pantalla -->
        <section class="card">
            <div class="card-header">
                <h2>Pila de Libros</h2>
                <span class="badge-count">Total: {{ stack.size() }}</span>
            </div>

            <div *ngIf="stack.isEmpty()" class="empty-msg">
                <p>La pila está vacía.</p>
            </div>

            <div class="stack-container" *ngIf="!stack.isEmpty()">
                <div *ngFor="let libro of stack.getItems(); let i = index" class="book-card" [class.top-book]="i === 0">
                    <div class="book-header">
                        <span class="top-tag" *ngIf="i === 0">TOPE DE LA PILA</span>
                        <span class="index-tag">Posición {{ stack.size() - i }}</span>
                    </div>
                    <h3>{{ libro.nombre }}</h3>
                    <p><strong>ISBN:</strong> {{ libro.isbn }}</p>
                    <p><strong>Autor:</strong> {{ libro.autor }}</p>
                    <p><strong>Editorial:</strong> {{ libro.editorial }}</p>
                </div>
            </div>
        </section>
    </div>
</div>
