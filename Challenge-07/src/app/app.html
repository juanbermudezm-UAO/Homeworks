<div class="layout">
  <aside class="sidebar">
    <nav class="sidebar-menu">
      <ng-container 
        *ngTemplateOutlet="recursiveMenu; context: { $implicit: arbolMenu.raiz.hijos }">
      </ng-container>
    </nav>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

<ng-template #recursiveMenu let-nodos>
  <ul class="menu-list">
    @for (nodo of nodos; track nodo.valor.titulo) {
      <li class="menu-item">
        @if (nodo.hijos.length > 0) {

          <div class="menu-parent" (click)="toggleMenu(nodo)">
            <span>{{ nodo.valor.titulo }}</span>
            <span class="arrow">{{ nodo.desplegado ? '▲' : '▼' }}</span>
          </div>


          @if (nodo.desplegado) {
            <div class="submenu-container">
              <ng-container 
                *ngTemplateOutlet="recursiveMenu; context: { $implicit: nodo.hijos }">
              </ng-container>
            </div>
          }
        } @else {

          <a [routerLink]="nodo.valor.link" routerLinkActive="active" class="menu-link">
            {{ nodo.valor.titulo }}
          </a>
        }
      </li>
    }
  </ul>
</ng-template>
