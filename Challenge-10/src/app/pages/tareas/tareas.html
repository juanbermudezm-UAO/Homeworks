<div class="tareas-container">
    <div class="header">
        <h1>Mis Tareas</h1>
        <button class="btn-logout" (click)="authSrv.salir()">Cerrar Sesión</button>
    </div>

    <section class="avatar-section">
        <label>Subir Avatar / Archivo:</label>
        <input type="file" accept="image/*" (change)="subirAvatar($event)">
        @if (urlAvatar()) {
        <div class="avatar-preview">
            <img [src]="urlAvatar()" class="avatar-img" alt="Avatar">
        </div>
        }
    </section>

    <form (ngSubmit)="agregar()" class="task-form">
        <input name="nueva" [(ngModel)]="nueva" placeholder="Nueva tarea..." required>
        <button type="submit">Agregar</button>
    </form>

    <ul class="task-list">
        @for (t of tareas(); track t.id) {
        <li class="task-item">
            <label>
                <input type="checkbox" [checked]="t.completada" (change)="srv.completar(t.id, !t.completada)">
                <span [class.completed]="t.completada">{{ t.titulo }}</span>
            </label>
            <button class="btn-delete" (click)="borrarTarea(t.id)">Borrar</button>
        </li>
        } @empty {
        <li class="empty-state">No hay tareas registradas.</li>
        }
    </ul>
</div>
