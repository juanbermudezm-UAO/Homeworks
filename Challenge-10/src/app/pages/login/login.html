<div class="login-container">
    <h2>Autenticación</h2>
    <form (ngSubmit)="entrar()">
        <div class="form-group">
            <input type="email" name="email" [(ngModel)]="email" placeholder="Correo electrónico" required>
        </div>
        <div class="form-group">
            <input type="password" name="clave" [(ngModel)]="clave" placeholder="Contraseña" required>
        </div>
        <div class="actions">
            <button type="submit">Entrar</button>
            <button type="button" (click)="registrar()">Crear cuenta</button>
        </div>
    </form>

    @if (msg) {
    <div class="message">{{ msg }}</div>
    }
</div>
